[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvoos"
version = "0.1.0"
description = "Stripped-down terminal agent: local model first, cheap cloud fallback, search, skills."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "rich>=13", "prompt_toolkit>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvoos = "jarvoos.cli:main"

[tool.setuptools]
packages = ["jarvoos"]

[tool.setuptools.package-data]
jarvoos = ["skills/*.md"]
